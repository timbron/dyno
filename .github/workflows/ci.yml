name: CI

on:
  push:
  pull_request:

env:
  GODOT_VERSION: 4.7.2-stable

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install gdtoolkit
        run: pip install "gdtoolkit==4.*"

      - name: Lint
        run: gdlint $(find . -name "*.gd" -not -path "./.godot/*")

      - name: Install Godot
        run: |
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}/Godot_v${GODOT_VERSION}_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv "Godot_v${GODOT_VERSION}_linux.x86_64" /usr/local/bin/godot
          rm godot.zip
          godot --version

      - name: Import
        run: |
          godot --headless --path . --import 2>&1 | tee import.log
          ! grep -E "SCRIPT ERROR|Parse Error|Compile Error" import.log

      - name: Tests
        run: |
          godot --headless --path . -s res://tests/run_tests.gd 2>&1 | tee tests.log
          ! grep -E "SCRIPT ERROR|^ERROR|FAIL:" tests.log
